name: Paket

# Push auf main: nur packen und prüfen, nichts hochladen.
# Tag v*: packen, prüfen, zu CurseForge hochladen und GitHub-Release anlegen.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leck-Prüfung
        run: |
          # Keine Mitautor-Zeilen, keine Schlüssel, keine Rechnerpfade, keine fremden Mail-Adressen im Repo.
          rot=0
          muster='co-authored-by|generated with|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|/home/[A-Za-z]|C:\\Users\\'
          if git grep -I -i -n -E -e "$muster" -- . ':!.github/workflows/release.yml'; then rot=1; fi
          if git log --format='%an <%ae>%n%cn <%ce>' | sort -u | grep -v -x 'DaveeeG <DaveeeG-byte@users.noreply.github.com>'; then rot=1; fi
          if git log --format='%B' | grep -i -E 'co-authored-by|generated with'; then rot=1; fi
          exit $rot

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.1 >/dev/null
          bash tests/run.sh
          STRICT=1 luajit tests/test_locales.lua

      - name: Packen (ohne Upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Zip prüfen
        run: |
          set -e
          zip=$(ls .release/*.zip | head -1)
          echo "Zip: $zip"
          unzip -l "$zip" | tail -n +4 | awk '{print $4}' > inhalt.txt
          grep -qx 'DeathNote/DeathNote.toc' inhalt.txt
          grep -qx 'DeathNote/Core.lua' inhalt.txt
          ! grep -q -E '(^|/)tests/|^DeathNote/DeathNote/|\.github|\.pkgmeta' inhalt.txt
          ! grep -v -E '^DeathNote/|^$|^-+$|^Name$' inhalt.txt | grep -q .
          echo "Dateien: $(grep -c '^DeathNote/' inhalt.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: DeathNote-zip
          path: .release/*.zip

      - name: Hochladen zu CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CURSEDFORGE }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

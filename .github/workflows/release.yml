name: Package

# Push to main: package and check only, upload nothing.
# Tag v*: package, check, upload to CurseForge and create a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leak check
        run: |
          # No co-author lines, no keys, no local machine paths, no foreign mail addresses in the repo.
          red=0
          pattern='co-authored-by|generated with|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|/home/[A-Za-z]|C:\\Users\\'
          if git grep -I -i -n -E -e "$pattern" -- . ':!.github/workflows/release.yml'; then red=1; fi
          if git log --format='%an <%ae>%n%cn <%ce>' | sort -u | grep -v -x 'DaveeeG <DaveeeG-byte@users.noreply.github.com>'; then red=1; fi
          if git log --format='%B' | grep -i -E 'co-authored-by|generated with'; then red=1; fi
          exit $red

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.1 >/dev/null
          bash tests/run.sh
          STRICT=1 luajit tests/test_locales.lua

      - name: Package (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Check zip
        run: |
          set -e
          zip=$(ls .release/*.zip | head -1)
          echo "Zip: $zip"
          unzip -l "$zip" | tail -n +4 | awk '{print $4}' > contents.txt
          grep -qx 'DeathNote/DeathNote.toc' contents.txt
          grep -qx 'DeathNote/Core.lua' contents.txt
          ! grep -q -E '(^|/)tests/|^DeathNote/DeathNote/|\.github|\.pkgmeta|(^|/)TRANSLATING\.md$' contents.txt
          ! grep -v -E '^DeathNote/|^$|^-+$|^Name$' contents.txt | grep -q .
          echo "Files: $(grep -c '^DeathNote/' contents.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: DeathNote-zip
          path: .release/*.zip
          include-hidden-files: true

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CURSEDFORGE }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
